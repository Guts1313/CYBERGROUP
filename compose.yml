# CYBERGROUP IAM — full-stack single-command deployment.
#
#   docker compose up -d --build
#
# Brings up the whole proof-of-concept:
#   postgres  : Keycloak's database
#   keycloak  : OIDC identity provider (imports the cybergroup realm)
#   backend   : Spring Boot OAuth2 resource server, built from ./backend
#   console   : the IAM Demo Console (token generation + RBAC walkthrough UI)
#
# Open http://localhost:5173 once everything is healthy.

name: cybergroup-iam

services:
  postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [iam-internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [iam-internal]

  backend:
    build:
      context: ./backend
    image: cybergroup/iam-backend:0.1.0
    container_name: iam-backend
    restart: unless-stopped
    environment:
      # Token issuer the backend trusts. The browser mints tokens via the published
      # localhost:8080 port, so the JWT 'iss' claim is localhost-based.
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/cybergroup
      # The backend container itself cannot reach 'localhost:8080', so it fetches the
      # signing keys (JWKS) over the internal docker network instead. Setting jwk-set-uri
      # explicitly decouples key retrieval from issuer-claim validation.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/cybergroup/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      - keycloak
    networks: [iam-internal]

  console:
    image: nginx:alpine
    container_name: iam-console
    restart: unless-stopped
    volumes:
      - ./demo-console:/usr/share/nginx/html:ro
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks: [iam-internal]

volumes:
  keycloak-pgdata:

networks:
  iam-internal:
    driver: bridge
