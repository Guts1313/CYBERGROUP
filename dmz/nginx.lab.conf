# =============================================================================
# CYBERGROUP - DMZ edge (LAB variant for the n2-test-dmz / 10.0.10.10 box).
# Standalone nginx (not docker-compose): upstream is Keycloak's REAL IP across
# the IdP VLAN. D1 scope = proxy KEYCLOAK ONLY (firewall rule #6); the backend +
# console arrive once the backend moves to Services (the deferred split).
# Same D3 hardening as the local config.
# =============================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=token_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=120r/m;
    limit_req_status 429;

    # ---- :80 -> redirect to HTTPS ----
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- :443 front door ----
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                   always;
        add_header Content-Security-Policy    "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options     "nosniff"                always;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        client_max_body_size 2m;

        # ---- Keycloak upstream: real IP, IdP VLAN (rule #6) ----
        location ~ ^/realms/[^/]+/protocol/openid-connect/token$ {
            limit_req            zone=token_zone burst=10 nodelay;
            client_max_body_size 64k;
            proxy_pass http://10.0.20.10:8080;
        }
        location /admin/ {
            limit_req zone=admin_zone burst=20 nodelay;
            # D3 admin allowlist (set real CIDRs once User VLANs exist):
            # allow 10.0.40.0/24;    # User-Admin
            # allow 10.99.100.0/24;  # VPN
            # deny  all;
            proxy_pass http://10.0.20.10:8080;
        }
        location /realms/    { proxy_pass http://10.0.20.10:8080; }
        location /resources/ { proxy_pass http://10.0.20.10:8080; }

        # ---- edge health landing (proves nginx+TLS without needing Keycloak) ----
        location = / { default_type text/plain; return 200 "CYBERGROUP DMZ edge - OK\n"; }
    }
}
