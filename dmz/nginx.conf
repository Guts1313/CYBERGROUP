# =============================================================================
# CYBERGROUP — DMZ edge reverse proxy   (D1 #9  +  D3 #24)
# -----------------------------------------------------------------------------
# Single public entry point: terminates TLS and reverse-proxies to the internal
# services. D3 hardening (TLS policy, security headers, rate limits, body caps,
# admin allowlist) is baked in here per the deployment-architecture research.
#
# LOCAL-DEV variant: upstreams are the docker compose service names
# (keycloak / backend / console) on the iam-internal network.
#
# For the NetLab DMZ box (10.0.10.10): change ONLY the three `set $..` upstream
# lines to the real IPs, serve the SPA from disk, swap in a real cert, and
# uncomment the admin allowlist — see dmz/README.md.
# =============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Docker's embedded DNS — re-resolve upstreams if a container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # ---- D3: rate-limit zones -------------------------------------------------
    limit_req_zone $binary_remote_addr zone=token_zone:10m rate=20r/m;   # OIDC /token
    limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=120r/m;  # /admin/
    limit_req_status 429;   # return 429 Too Many Requests (nginx default is 503)

    log_format edge '$remote_addr "$request" $status '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log edge;

    # ---- :80  ->  redirect to HTTPS -------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- :443  the single front door ------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;

        # ---- D3: TLS policy (TLS 1.2 + 1.3 only, Modern ciphers) --------------
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # ---- D3: security headers (every response) ---------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                   always;
        add_header Content-Security-Policy    "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options     "nosniff"                always;

        # Strip the upstream's own copies so the edge values above are the single
        # source of truth (Keycloak also emits HSTS / X-Frame-Options / nosniff).
        # CSP is deliberately NOT hidden: Keycloak's per-page CSP stays authoritative
        # for its login UI (D3 #24) — nginx's frame-ancestors is additive.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;

        # ---- forwarded headers (so Keycloak builds correct absolute URLs) ----
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_http_version 1.1;

        client_max_body_size 2m;          # global cap; tightened on /token below

        # upstreams (variables => re-resolved via docker DNS at request time)
        set $kc  keycloak:8080;
        set $api backend:8081;
        set $spa console:80;

        # ---- D3: OIDC token endpoint — 20 req/min + 64 KiB body --------------
        location ~ ^/realms/[^/]+/protocol/openid-connect/token$ {
            limit_req            zone=token_zone burst=10 nodelay;
            client_max_body_size 64k;
            proxy_pass http://$kc;
        }

        # ---- D3: Keycloak admin — 120 req/min  (+ allowlist on the DMZ box) ---
        location /admin/ {
            limit_req zone=admin_zone burst=20 nodelay;
            # --- D3 admin allowlist: uncomment + set real CIDRs in NetLab ---
            # allow 10.0.40.0/24;    # User-Admin VLAN
            # allow 10.99.100.0/24;  # VPN tunnel
            # deny  all;
            proxy_pass http://$kc;
        }

        # ---- Keycloak realm + login pages + static resources -----------------
        location /realms/    { proxy_pass http://$kc; }
        location /resources/ { proxy_pass http://$kc; }

        # ---- backend API -----------------------------------------------------
        location /api/ { proxy_pass http://$api; }

        # ---- demo console SPA (everything else) ------------------------------
        location / { proxy_pass http://$spa; }
    }
}
